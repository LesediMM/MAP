# ============================================================
# Render Deployment — Sokoto & Kebbi Town Status Map
# ============================================================
#
# HOW TO DEPLOY IN 3 STEPS:
#
# 1. Download this project as a ZIP from Replit, then push to GitHub.
#
# 2. On Render.com:
#    → New → Blueprint → connect your GitHub repo.
#    Render reads this file and auto-configures everything below.
#
# 3. Push any future town data change to GitHub →
#    Render auto-rebuilds and the live site updates in ~1 minute.
#
# ── Manual dashboard settings (if NOT using Blueprint) ─────
#   Service type    : Static Site
#   Root directory  : (leave blank)
#   Build command   : pnpm install && pnpm --filter @workspace/sokoto-kebbi-map run build
#   Publish directory : artifacts/sokoto-kebbi-map/dist/public
#   Branch          : main
#   Auto-deploy     : Yes
# ============================================================

services:
  - type: web
    name: sokoto-kebbi-map
    env: static
    buildCommand: pnpm install && pnpm --filter @workspace/sokoto-kebbi-map run build
    staticPublishPath: artifacts/sokoto-kebbi-map/dist/public
    branch: main
    autoDeploy: true
    envVars:
      - key: BASE_PATH
        value: /
      - key: NODE_VERSION
        value: "20"
